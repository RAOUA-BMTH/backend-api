name: Deploying to Staging

on:
    push:
      branches:
        - main

jobs:
    test:
        runs-on:
            - ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: install dependencies
              run: npm install
            - name: run tests
              run: npm test

    deploy-and-push:
        needs: test
        runs-on:
            - ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: build docker image 
              run: npm build -t raouamth/backend-session16:latest .
            - name: push docker image to docker hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: push image
              run: docker push raouamth/backend-session16:latest    
              